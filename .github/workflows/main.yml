name: Test-pipeline | Build → Push → Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:

    runs-on:
      - self-hosted
      - onliest-test-pipeline

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.run_number }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create .env file from GitHub Secret
        shell: bash
        run: |
          set -euo pipefail

          cat << 'EOF' > .env
          ${{ secrets.TEST_REPO_ENV }}
          EOF

      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Docker image"
          echo "Image Tag: v${IMAGE_TAG}"
          echo "=========================================="

          sudo docker build \
            -t onliest-test-pipeline:v${IMAGE_TAG} \
            .

      - name: Tag image for ECR
        shell: bash
        run: |
          set -euo pipefail

          echo "Tagging Docker image..."

          sudo docker tag \
            onliest-test-pipeline:v${IMAGE_TAG} \
            ${ECR_REPOSITORY_URI}:v${IMAGE_TAG}

          echo "Image tagged as:"
          echo "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

      - name: Push Docker image to ECR
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Pushing image to ECR"
          echo "Repository: ${ECR_REPOSITORY_URI}"
          echo "Tag: v${IMAGE_TAG}"
          echo "=========================================="

          if sudo docker push "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"; then

            echo "Image pushed successfully."

          else

            echo "Initial push failed."
            echo "Logging into ECR again..."

            aws ecr get-login-password \
              --region "${AWS_REGION}" \
              | sudo docker login \
                  --username AWS \
                  --password-stdin \
                  "$(echo "${ECR_REPOSITORY_URI}" | awk -F'/' '{print $1}')"

            echo "Retrying Docker push..."

            sudo docker push \
              "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

          fi

      - name: Verify image exists locally
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking pushed image..."

          sudo docker image inspect \
            "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}" \
            > /dev/null

          echo "Image verification successful."

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE_DIR="/opt/docker_compose_files/onliest-test-pipeline"

          cd "${COMPOSE_DIR}"

          echo "=========================================="
          echo "Deployment Information"
          echo "=========================================="

          echo "Repository:"
          echo "${ECR_REPOSITORY_URI}"

          echo "Image Tag:"
          echo "v${IMAGE_TAG}"

          echo "Full Image:"
          echo "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

          echo "=========================================="

          echo ""
          echo "Current docker-compose.yml:"
          echo "------------------------------------------"

          sudo cat docker-compose.yml

          echo ""
          echo "Updating Docker image..."

          sudo sed -i \
            "s|^[[:space:]]*image:.*|    image: ${ECR_REPOSITORY_URI}:v${IMAGE_TAG}|" \
            docker-compose.yml

          echo ""
          echo "Updated docker-compose.yml:"
          echo "------------------------------------------"

          sudo cat docker-compose.yml

          echo ""
          echo "Pulling latest image..."

          sudo docker compose pull

          echo ""
          echo "Stopping existing container..."

          sudo docker compose down

          echo ""
          echo "Starting updated container..."

          sudo docker compose up -d

          echo ""
          echo "Checking container status..."

          sudo docker compose ps

          echo ""
          echo "Deployment completed successfully."
