name: Test-pipeline | Build → Push → Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:

    runs-on:
      - self-hosted
      - onliest-test-pipeline

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.run_number }}
      ECR_REPOSITORY_URI: ${{ secrets.ECR_REPOSITORY_URI }}

    steps:

      # ------------------------------------
      # Checkout Repository
      # ------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ------------------------------------
      # Login to Amazon ECR
      # ------------------------------------
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------
      # Create .env File
      # ------------------------------------
      - name: Create .env file from GitHub Secret
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating .env file..."

          cat << 'EOF' > .env
          ${{ secrets.TEST_REPO_ENV }}
          EOF


      # ------------------------------------
      # Build Docker Image
      # ------------------------------------
      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Docker Image"
          echo "=========================================="

          echo "Image Tag: v${IMAGE_TAG}"

          sudo docker build \
            -t onliest-test-pipeline:v${IMAGE_TAG} \
            .


      # ------------------------------------
      # Tag Docker Image
      # ------------------------------------
      - name: Tag image to ECR URI
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Tagging Docker Image"
          echo "=========================================="

          echo "Local Image:"
          echo "onliest-test-pipeline:v${IMAGE_TAG}"

          echo ""

          echo "ECR Image:"
          echo "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

          sudo docker tag \
            onliest-test-pipeline:v${IMAGE_TAG} \
            "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"


      # ------------------------------------
      # Push Image to ECR
      # ------------------------------------
      - name: Push Docker image to ECR
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Pushing Image to ECR"
          echo "=========================================="

          echo "Repository: ${ECR_REPOSITORY_URI}"
          echo "Tag: v${IMAGE_TAG}"

          sudo docker push \
            "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

          echo "Docker image pushed successfully."


      # ------------------------------------
      # Verify Image
      # ------------------------------------
      - name: Verify Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Docker Image"
          echo "=========================================="

          sudo docker images | grep "${IMAGE_TAG}"


      # ------------------------------------
      # Deploy Application
      # ------------------------------------
      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE_DIR="/opt/docker_compose_files/onliest-test-pipeline"

          cd "${COMPOSE_DIR}"

          echo "=========================================="
          echo "Deployment Started"
          echo "=========================================="

          echo "ECR Repository:"
          echo "${ECR_REPOSITORY_URI}"

          echo ""

          echo "Image Tag:"
          echo "v${IMAGE_TAG}"

          echo ""

          echo "Full Docker Image:"
          echo "${ECR_REPOSITORY_URI}:v${IMAGE_TAG}"

          echo "=========================================="


          # Export variables for Docker Compose
          export ECR_REPOSITORY_URI="${ECR_REPOSITORY_URI}"
          export IMAGE_TAG="${IMAGE_TAG}"


          echo "Docker Compose configuration:"
          echo "------------------------------------------"

          sudo docker compose config


          echo ""
          echo "Pulling Docker image..."
          echo "------------------------------------------"

          sudo docker compose pull


          echo ""
          echo "Stopping existing container..."
          echo "------------------------------------------"

          sudo docker compose down


          echo ""
          echo "Starting new container..."
          echo "------------------------------------------"

          sudo docker compose up -d


          echo ""
          echo "Checking container status..."
          echo "------------------------------------------"

          sudo docker compose ps


          echo ""
          echo "Deployment completed successfully."
